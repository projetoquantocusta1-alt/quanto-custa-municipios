name: Prefeituras de outros estados (SICONFI)

on:
  schedule:
    - cron: "27 6 * * *"     # todo dia às 03:27 (horário de Brasília)
  workflow_dispatch:
    inputs:
      uf:
        description: "Estado (sigla)"
        required: false
        default: "BA"

permissions:
  contents: write

concurrency:
  group: atualizar-municipios
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar no SICONFI (Tesouro Nacional)
        run: python atualizar_siconfi.py --uf "${{ github.event.inputs.uf || 'BA' }}" --minutos 100
      - name: Publicar
        if: always()
        run: |
          git config user.name  "robo-quanto-custa"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p dados_brutos/siconfi
          git add dados_brutos/siconfi
          if ! git diff --cached --quiet; then
            git commit -m "municipios: SICONFI ($(date -u +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              git pull --rebase -X ours origin main || true
              if git push; then break; fi
              echo "Envio recusado; nova tentativa em $((i*20)) s"; sleep $((i*20))
              [ $i = 5 ] && exit 1
            done
          fi
