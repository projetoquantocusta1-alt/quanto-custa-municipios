name: Atualizar municipios (TCE-CE)

on:
  schedule:
    - cron: "37 9 * * *"     # todo dia às 06:37 (horário de Brasília)
  workflow_dispatch:
    inputs:
      minutos:
        description: "Limite de tempo da coleta, em minutos"
        required: false
        default: "300"

permissions:
  contents: write

concurrency:
  group: atualizar-municipios
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Coletar no TCE, montar o site e publicar (em 3 rodadas, salvando entre elas)
        run: |
          git config user.name  "robo-quanto-custa"
          git config user.email "actions@users.noreply.github.com"
          TOTAL="${{ github.event.inputs.minutos || '300' }}"
          RODADA=$(( TOTAL / 3 ))
          for rodada in 1 2 3; do
            echo "== Rodada $rodada de 3 ($RODADA min) =="
            python atualizar.py --minutos "$RODADA" || echo "::warning::rodada $rodada terminou com erro"
            mkdir -p docs/dados dados_brutos
            git add docs/dados dados_brutos
            if ! git diff --cached --quiet; then
              git commit -m "municipios: dados de $(date -u +%Y-%m-%d) (rodada $rodada)"
              # tenta salvar até 5 vezes (o GitHub recusa se outro envio chegou no mesmo instante)
              for i in 1 2 3 4 5; do
                git pull --rebase -X ours origin main || true
                if git push; then break; fi
                echo "Envio recusado; nova tentativa em $((i*20)) s"; sleep $((i*20))
              done
            fi
          done
